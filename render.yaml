services:
  - type: web
    name: lostnfound-api-chyun1105
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: lostnfound-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
